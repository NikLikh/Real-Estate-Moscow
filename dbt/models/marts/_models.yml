version: 2

models:
  - name: ml_listings_wide
    columns:
      - name: cian_id
        tests:
          - not_null
      - name: days_on_market
        tests:
          - not_null

  - name: current_listings
    columns:
      - name: cian_id
        tests:
          - not_null
          - unique
      - name: price_per_m2
        tests:
          - not_null

  - name: price_index_monthly
    columns:
      - name: median_ppm2
        tests:
          - not_null
