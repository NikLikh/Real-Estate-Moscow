cian_base: "https://www.cian.ru/cat.php?deal_type=sale&engine_version=2&offer_type=flat"

auto_discover: true
endpoint_preflight: true
endpoint_preflight_retries: 2
runtime_endpoint_types: [proxy]
experimental_endpoint_types: [vpn_extension, web_proxy]

endpoint_policies:
  default:
    network_cooldown: 3
    captcha_cooldown: 5
    quarantine_cooldown: 300
    max_warming_failures: 3
    max_quarantine_failures: 5

endpoints:
  - name: direct
    proxy: null
    rate_limit: 2.0

regions:
  msk:
    id: 1
    rooms:
      studio: "room9=1"
      1-room: "room1=1"
      2-room: "room2=1"
      3-room: "room3=1"
      4-room: "room4=1"
      5+room: "room5=1&room6=1"
    prices:
      - [3_000_000, 6_000_000]
      - [6_000_000, 10_000_000]
      - [10_000_000, 15_000_000]
      - [15_000_000, 20_000_000]
      - [20_000_000, 30_000_000]
      - [30_000_000, 50_000_000]
      - [50_000_000, 100_000_000]
      - [100_000_000, null]
    object_types:
      new: "object_type%5B0%5D=1"
      resale: "object_type%5B0%5D=2"

  mo:
    id: 4593
    rooms:
      studio: "room9=1"
      1-room: "room1=1"
      2-room: "room2=1"
      3-room: "room3=1"
      4+room: "room4=1&room5=1&room6=1"
    prices:
      - [3_000_000, 6_000_000]
      - [6_000_000, 10_000_000]
      - [10_000_000, 15_000_000]
      - [15_000_000, 25_000_000]
      - [25_000_000, 50_000_000]
      - [50_000_000, null]
    object_types:
      new: "object_type%5B0%5D=1"
      resale: "object_type%5B0%5D=2"

  spb:
    id: 2
    rooms:
      studio: "room9=1"
      1-room: "room1=1"
      2-room: "room2=1"
      3-room: "room3=1"
      4+room: "room4=1&room5=1&room6=1"
    prices:
      - [2_000_000, 5_000_000]
      - [5_000_000, 8_000_000]
      - [8_000_000, 12_000_000]
      - [12_000_000, 18_000_000]
      - [18_000_000, 30_000_000]
      - [30_000_000, 60_000_000]
      - [60_000_000, null]
    object_types:
      new: "object_type%5B0%5D=1"
      resale: "object_type%5B0%5D=2"

  lo:
    id: 4588
    rooms:
      studio: "room9=1"
      1-room: "room1=1"
      2-room: "room2=1"
      3-room: "room3=1"
      4+room: "room4=1&room5=1&room6=1"
    prices:
      - [1_500_000, 3_000_000]
      - [3_000_000, 5_000_000]
      - [5_000_000, 7_000_000]
      - [7_000_000, 10_000_000]
      - [10_000_000, 15_000_000]
      - [15_000_000, null]
    object_types:
      new: "object_type%5B0%5D=1"
      resale: "object_type%5B0%5D=2"

allowed_region_ids: [1, 4593, 2, 4588]

skip_url_parts:
  - "/sale/room/"
  - "/sale/share/"

skip_phrases:
  - "продаётся комната"
  - "продается комната"
  - "продаётся доля"
  - "продается доля"
  - "комната в "
  - "доля в "

max_concurrent: 15
planner_workers: 3
planner_concurrency: 200
retry_workers: 1

waf_endpoint_cooldown: 3
cb_window: 30
cb_threshold: 12
cb_cooldown: 30

use_direct_slot: true
ip_budget: 160
waf_retire_limit: 10

max_pages: 200
cards_per_page: 28
pool_starved_backoff: 2
max_offers_per_filter: 400
min_price_split: 25_000
plan_from_db: true
plan_target_bucket: 300

deals:
  sale: {}
  rent_long:
    max_offers: 500
    min_split: 500
    price_cap: 400_000
  rent_day:
    max_offers: 500
    min_split: 100
    price_cap: 40_000

max_restarts: 2
restart_cooldown: 120
max_worker_crashes: 20
memory_threshold_mb: 3000
min_alive_slots: 5
pool_low_grace: 600

vpn_extensions:
  - extension: browsec
    path: extensions/browsec
    servers: [nl, uk, de, lt, lv, sg, us]
    rate_limit: 2.0

api_full_extract: true

http_listing_workers: 400
http_listing_concurrency: 500
api_listing_endpoint: "https://api.cian.ru/search-offers/v1/search-offers-mobile-site/"
api_zhk_endpoint: "https://api.cian.ru/search-offers/v1/search-offers-mobile-site/"
http_offer_workers: 60
p2_max_urls: 3000
http_offer_batch: 3
http_max_concurrent_per_proxy: 8
http_per_slot_concurrency: 50
http_rate_per_slot: 1.9
http_timeout: 22
http_retry_max: 3
http_waf_cooldown: 6
http_captcha_cooldown: 5
captcha_streak_limit: 3
captcha_streak_cooldown: 0
slot_burst: 3
slot_window: 0
proxy_connect_timeout: 12
proxy_list_refresh: 1800
proxy_recheck_after: 3600
proxy_list_cap: 4000
proxy_target_slots: 120
validation_concurrency: 80
proxy_validate_timeout: 20
listing_page_tries: 6
listing_page_batch: 3
listing_empty_tries: 1
slot_wait_limit: 120
zhk_max_per_run: 1000
zhk_max_pages: 40
zhk_phase_timeout: 420
net_error_threshold: 2
net_error_cooldown: 60
free_proxy_discovery: false
pool_warmup_wait: 600
browsec_refresh_interval: 1200
vpn_discovery_timeout: 90
oneclickvpn_uuid: ""
enable_oneclickvpn: false
net_error_quarantine: 3
net_error_quarantine_cooldown: 300
cian_validation: true
